<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Chart.js Tutorial</title>
    <style>
        body {
            font-family: Arial;
            padding: 20px;
        }

        .chart-container {
            width: 600px;
            margin: auto;
        }
    </style>
</head>

<body>

    <h2>My First Chart</h2>

    <div class="chart-container">
        <h2>Line Chart</h2>
        <canvas id="myChart1"></canvas>
        <h2>Bar Chart</h2>
        <canvas id="myChart2"></canvas>
        <h2>Doughnut Chart</h2>
        <canvas id="myChart3"></canvas>
    </div>

    <!-- ✅ Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
        // JS will go here
        const ctx1 = document.getElementById('myChart1');
        const ctx2 = document.getElementById('myChart2');
        const ctx3 = document.getElementById('myChart3');
        const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun'];
        const revenue = [50000, 60000, 55000, 70000, 75000, 80000];
        const expenses = [30000, 35000, 32000, 40000, 42000, 45000];
        const profit = [20000, 25000, 23000, 30000, 33000, 35000];

        new Chart(ctx1, {
            type: 'line',
            data: {
                labels: months,
                datasets: [{
                    label: 'Sales',
                    data: revenue,
                    backgroundColor: ['red', 'blue', 'green', 'orange']
                },
                {
                    label: 'Expenses',
                    data: expenses,
                    backgroundColor: ['purple', 'pink', 'yellow', 'cyan']
                },
                {
                    label: 'Profit',
                    data: profit,
                    backgroundColor: ['gray', 'brown', 'teal', 'lime']
                }]
            }
        });
        //ctx2 is going to be a bar chart
        new Chart(ctx2,{
            type:"bar",
            data:{
                labels:months,
                datasets:[{
                    label:"Revenue",
                    data:revenue,
                    backgroundColor:""
                }]
            }
        });

        // ctx3 is going to be a doughught chart
        new Chart(ctx3,{
            type:"doughnut",
            data:{
                labels:months,
                datasets:[{
                    lable:"profit",
                    data:profit,
                    backgroundColor:""
                }]
            }
        })
    </script>

</body>

</html>
