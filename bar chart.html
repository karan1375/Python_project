<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Sales Dashboard</title>
    <style>
        body {
            font-family: Arial;
            padding: 20px;
        }

        .chart-container {
            width: 600px;
            margin: auto;
        }
    </style>
</head>

<body style="background-color: rgba(220, 239, 247, 0.726);">
        <h2>My First Chart</h2>

    <div class="chart-container">
        <h2>Line Chart <br>Sales, Expenses, Profit</h2>
        <canvas id="myChart1"></canvas>
        <h2>Bar Chart <br>Revenue </h2>
        <canvas id="myChart2"></canvas>
        <h2>Doughnut Chart<br>Expenses</h2>
        <canvas id="myChart3"></canvas>
        <h2>Line Chart<br>Profit</h2>
        <canvas id="myChart4"></canvas>
    </div>

    <!-- ✅ Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
        // JS will go here
        const ctx1 = document.getElementById('myChart1');
        const ctx2 = document.getElementById('myChart2');
        const ctx3 = document.getElementById('myChart3');
        const ctx4 = document.getElementById('myChart4');
        const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun'];
        const revenue = [50000, 60000, 55000, 70000, 75000, 80000];
        const expenses = [30000, 35000, 32000, 40000, 42000, 45000];
        const profit = [20000, 25000, 23000, 30000, 33000, 35000];





        new Chart(ctx1, {
            options: {
                scales: {
                    r: {
                        beginAtZero: true,
                        min: 0
                        // max: 100
                    }
                }
            },
            type: 'bar',
            data: {
                labels: months,
                datasets: [{
                    label: 'Sales',
                    data: revenue,
                    backgroundColor: ['red', 'blue', 'green', 'orange']
                },
                {
                    label: 'Expenses',
                    data: expenses,
                    backgroundColor: ['purple', 'pink', 'yellow', 'cyan']
                },
                {
                    label: 'Profit',
                    data: profit,
                    backgroundColor: ['gray', 'brown', 'teal', 'lime']
                }]
            }
        });
        //ctx2 is going to be a bar chart
        new Chart(ctx2, {
            options: {
                scales: {
                    r: {
                        beginAtZero: true,
                        min: 0
                        // max: 100
                    }
                }
            },
            type: "bar",
            data: {
                labels: months,
                datasets: [{
                    label: "Revenue",
                    data: revenue,
                    backgroundColor:"green"
                }]
            }
        });

        // ctx3 is going to be a doughught chart
        new Chart(ctx3, {

            type: "doughnut",
            data: {
                labels: months,
                datasets: [{
                    label: "Expenses",
                    data: expenses,
                    backgroundColor:[
                        "red",
                        "blue",
                        "green",
                        "orange",
                        "purple",
                        "yellow"
                    ]
            
                }]
            }
        });
        //ctx4 is going to be a pie chart
        new Chart(ctx4, {
            options: {
                scales: {
                    y: {
                        beginAtZero: true,
                        min: 0
                        // max: 100
                    }
                }
            },
            type: "line",
            data: {
                labels: months,
                datasets: [{
                    label: "profit",
                    data: profit,
                    backgroundColor: "red",
                    
                }]
            }

        })
    </script>

</body>

</html>
